name: monadiam-conformance-local

x-proxy-image: &proxy-image registry.gitlab.com/openid/conformance-suite/nginx@sha256:72e60c130bf34383c36aec26257177d683145452e5d1c400f93697d3c9baedae
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  certificates:
    image: *proxy-image
    entrypoint: [sh, /bootstrap/certificates.sh]
    volumes:
      - ./docker/proxy/certificates.sh:/bootstrap/certificates.sh:ro
      - ./.local/certs:/certs
    logging: *logging

  mongodb:
    image: mongo:6.0.13
    volumes:
      - mongodb:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  server:
    image: registry.gitlab.com/openid/conformance-suite@sha256:c8ee26f893d0709afc76ea9633ddfda548000f133f53e6cfe4be960edfed8240
    entrypoint: [sh, /bootstrap/entrypoint.sh]
    environment:
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - ./docker/suite/entrypoint.sh:/bootstrap/entrypoint.sh:ro
      - ./.local/certs:/certs:ro
    depends_on:
      certificates:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", --header, "X-Forwarded-Proto: https", http://127.0.0.1:8080/]
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 20s
    logging: *logging

  iam-loopback:
    image: *proxy-image
    network_mode: service:server
    volumes:
      - ./docker/proxy/nginx-loopback.conf:/etc/nginx/nginx.conf:ro
      - ./.local/certs:/certs:ro
    depends_on:
      server:
        condition: service_healthy
      proxy:
        condition: service_started
    logging: *logging

  proxy:
    image: *proxy-image
    ports:
      - "127.0.0.1:8443:8443"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      default:
        aliases:
          - conformance.test
          - iam.test
    volumes:
      - ./docker/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.local/certs:/certs:ro
    depends_on:
      certificates:
        condition: service_completed_successfully
      server:
        condition: service_healthy
    logging: *logging

volumes:
  mongodb:
